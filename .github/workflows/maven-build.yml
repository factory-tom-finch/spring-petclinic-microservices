# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B verify --file pom.xml
    - name: Verify Maven wrapper
      run: ./mvnw -B verify
    - name: Verify executable and extracted jars
      run: python3 scripts/verify_jars.py
    - uses: actions/upload-artifact@v4
      with:
        name: service-jars
        path: spring-petclinic-*/target/*.jar
        retention-days: 3

  containers:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: service-jars
        path: .
    - name: Verify Java 21 images and Compose launchers
      run: sh scripts/verify_containers.sh

  mysql57:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: petclinic
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: petclinic
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
    - uses: actions/checkout@v4
      with:
        path: source
    - uses: actions/checkout@v4
      with:
        repository: spring-petclinic/spring-petclinic-microservices-config
        ref: 323993ce2519c6d02df63e08bf4458d123d3b611
        path: external-config
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin
    - uses: actions/download-artifact@v4
      with:
        name: service-jars
        path: source
    - name: Verify strict MySQL profile, customers before visits
      run: python3 source/scripts/verify_mysql.py external-config

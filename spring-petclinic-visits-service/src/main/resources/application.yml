spring:
  application:
    name: visits-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}

management:
  tracing:
    propagation:
      consume: [B3, B3_MULTI, W3C]
      produce: [B3_MULTI]

---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888

management:
  zipkin:
    tracing:
      endpoint: http://tracing-server:9411/api/v2/spans
